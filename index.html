<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1f2b">
<title>Renshuu Offline</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#12151d;--card:#1c2130;--card2:#252b3d;--text:#eef1f8;--dim:#9aa3b5;--acc:#3b82c4;--ok:#4caf6a;--bad:#e05a4f;--warn:#e0a24f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header h1{font-size:19px;margin:0;flex:1}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--dim)}
.pill.on{background:#1f3b2a;color:#8fe0a6}.pill.off{background:#3b2a1f;color:#f0b97a}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 8px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #2a3044}
.row:first-of-type{border-top:0}
.row .n{flex:1}
.row .c{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:#fff;border:0;border-radius:11px;padding:11px 16px;font:inherit;font-size:15px;text-decoration:none;cursor:pointer}
button.sec,.btn.sec{background:var(--card2)}
button.sm{padding:7px 12px;font-size:14px}
button:disabled{opacity:.45}
.big{width:100%;padding:14px;font-size:16px;margin-top:8px}
.dim{color:var(--dim)}.small{font-size:13px}
.note{font-size:13px;color:var(--dim);margin-top:8px}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok)}
/* quiz */
#quiz{display:none}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qtop .prog{flex:1;color:var(--dim);font-size:14px}
.qcard{background:var(--card);border-radius:16px;padding:18px 14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.qprompt{font-size:44px;line-height:1.2;word-break:break-word}
.qprompt.mean{font-size:19px;text-align:left;align-self:stretch}
.qprompt.mean ol{margin:0;padding-left:22px}
.qpos{color:var(--dim);font-size:13px;margin-top:6px}
.qask{background:#1d4766;color:#dbeaff;border-radius:9px;padding:6px 10px;margin:12px 0 8px;font-size:14px}
.choices{display:grid;gap:8px}
.choice{background:var(--card2);color:var(--text);border-radius:12px;padding:13px 12px;text-align:left;font-size:18px;border:2px solid transparent;width:100%;justify-content:flex-start}
.choice.en{font-size:15px}
.choice .k{color:var(--dim);font-size:12px;margin-right:8px;min-width:12px}
.choice.right{border-color:var(--ok);background:#1d3a28}
.choice.wrong{border-color:var(--bad);background:#3e1f1f}
.idk{margin-top:10px;width:100%;background:transparent;color:var(--warn);border:1px solid #5a4630}
.fb{margin-top:12px;border-radius:14px;padding:14px;background:var(--card)}
.fb .res{font-weight:700;font-size:17px;margin-bottom:6px}
.fb .res.ok{color:#7ddc8a}.fb .res.bad{color:#ff8a80}
.fb .term{font-size:30px}
.fb .read{font-size:18px;color:#c9d4ea}
.fb ol{margin:6px 0 0;padding-left:22px}
.fb .next{width:100%;margin-top:12px}
textarea.code{width:100%;min-height:90px;background:#0d1016;color:#cfe;border:1px solid #2a3044;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,monospace}
ol.steps{padding-left:20px;margin:6px 0}ol.steps li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#263148;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px #0008;z-index:9;max-width:90vw}
details summary{cursor:pointer;color:var(--dim)}
select{background:var(--card2);color:var(--text);border:0;border-radius:8px;padding:6px 8px;font:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Renshuu Offline</h1><span id="net" class="pill">…</span></header>

  <div id="home"></div>

  <div id="quiz">
    <div class="qtop"><button class="sec sm" id="qquit">✕ End</button><div class="prog" id="qprog"></div></div>
    <div class="bar"><i id="qbar" style="width:0"></i></div>
    <div style="height:10px"></div>
    <div class="qcard"><div id="qprompt" class="qprompt"></div><div id="qpos" class="qpos"></div></div>
    <div class="qask" id="qask"></div>
    <div class="choices" id="qchoices"></div>
    <button class="idk" id="qidk">I don't know</button>
    <div id="qfb"></div>
  </div>
</div>

<script>
'use strict';
/* ================= storage ================= */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('rso.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('rso.' + k, JSON.stringify(v)); return true; } catch (e) { toast('Storage full or blocked: ' + e.message); return false; } }
};
let pack = LS.get('pack', null);          // current download
let results = LS.get('results', []);      // answers waiting to be sent to Renshuu
let keep = LS.get('items', {});           // items from older packs still referenced by unsent results
let done = LS.get('done', { pack: null, keys: [] }); // tasks answered for current pack (survives sync)
let settings = LS.get('settings', { size: 20 });
const RENSHUU = 'https://app.renshuu.org/me';
const APP_BASE = new URL('./', location.href).href.split('#')[0];

/* ================= helpers ================= */
const VOCAB_VECTORS = ['Kanji > Kana', 'Kana > Kanji', 'Kanji > Meaning', 'Meaning > Kanji', 'Kana > Meaning', 'Meaning > Kana'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rid = () => Math.random().toString(36).slice(2, 10);
const itemKey = it => it.s + '|' + it.t + '|' + it.id;
const taskKey = (it, v) => itemKey(it) + '|' + v;
function meaningLabel(defs) { if (!defs || !defs.length) return ''; return defs.length > 1 ? defs.map((d, i) => (i + 1) + '. ' + d).join('; ') : defs[0]; }
function toast(msg, ms) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 3200); }
async function b64Encode(obj) {
  const s = new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = new Uint8Array(await new Response(s).arrayBuffer());
  let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function b64Decode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '=';
  const buf = Uint8Array.from(atob(str), c => c.charCodeAt(0));
  const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(s).text());
}
function doneSet() { return new Set(done.pack === (pack && pack.id) ? done.keys : []); }
function pendingKeys() { return new Set(results.map(r => r.s + '|' + r.t + '|' + r.i + '|' + r.v)); }

/* ================= quiz building ================= */
// what is asked and what is answered, per vector
function spec(it, v) {
  if (it.t === 'v') {
    const K = it.K || it.H, H = it.H, kanaOnly = K === H;
    const M = it.D || [];
    switch (v) {
      case 'Kanji > Kana': return { prompt: { type: 'ja', text: K }, ans: { type: 'kana', text: H }, ask: 'Reading (hiragana/katakana)' };
      case 'Kana > Kanji': return { prompt: { type: 'ja', text: H }, ans: { type: 'word', text: K }, ask: 'Kanji' };
      case 'Kanji > Meaning': return { prompt: { type: 'ja', text: K }, ans: { type: 'mean', text: meaningLabel(M) }, ask: 'Meaning' };
      case 'Meaning > Kanji': return { prompt: { type: 'mean', list: M }, ans: { type: kanaOnly ? 'kana' : 'word', text: K }, ask: kanaOnly ? 'Word' : 'Kanji' };
      case 'Kana > Meaning': return { prompt: { type: 'ja', text: H }, ans: { type: 'mean', text: meaningLabel(M) }, ask: 'Meaning' };
      case 'Meaning > Kana': return { prompt: { type: 'mean', list: M }, ans: { type: 'kana', text: H }, ask: 'Reading (hiragana/katakana)' };
    }
  } else {
    switch (v) {
      case 'Definition': return { prompt: { type: 'ja', text: it.C }, ans: { type: 'kdef', text: it.D }, ask: 'Meaning of this kanji' };
      case 'Onyomi': { const r = pickReading(it, it.onB && it.onB.length ? it.onB : it.on); return { prompt: { type: 'ja', text: r, small: true }, ans: { type: 'kchar', text: it.C, reading: r }, ask: 'Kanji with this on\'yomi' }; }
      case 'Kunyomi': { const r = pickReading(it, it.kunB && it.kunB.length ? it.kunB : it.kun); return { prompt: { type: 'ja', text: r, small: true }, ans: { type: 'kchar', text: it.C, reading: r }, ask: 'Kanji with this kun\'yomi' }; }
    }
  }
  return null;
}
function pickReading(it, list) { return list && list.length ? list[Math.floor(Math.random() * list.length)] : '?'; }

let pools = null;
function allItems() { const m = new Map(); for (const it of Object.values(keep)) m.set(itemKey(it), it); if (pack) for (const it of pack.items) m.set(itemKey(it), it); return [...m.values()]; }
function buildPools() {
  const its = allItems();
  const P = { kana: new Set(), word: new Set(), mean: new Set(), kdef: new Set(), kchar: new Map() };
  for (const it of its) {
    if (it.t === 'v') {
      if (it.H) P.kana.add(it.H);
      if (it.K && it.K !== it.H) P.word.add(it.K);
      if (it.D && it.D.length) P.mean.add(meaningLabel(it.D));
    } else {
      P.kdef.add(it.D);
      P.kchar.set(it.C, [...(it.on || []), ...(it.kun || [])]);
    }
  }
  // extra kanji characters from vocab words (readings unknown, only used when not conflicting)
  for (const w of P.word) for (const ch of w) if (/[一-龯]/.test(ch) && !P.kchar.has(ch)) P.kchar.set(ch, null);
  pools = { kana: [...P.kana], word: [...P.word], mean: [...P.mean], kdef: [...P.kdef], kchar: P.kchar };
}
function similarity(a, b) {
  let s = -Math.abs(a.length - b.length);
  const set = new Set(a); for (const ch of b) if (set.has(ch)) s += 0.6;
  return s + Math.random() * 1.5;
}
function distractors(ans) {
  const t = ans.type, correct = ans.text;
  let cands;
  if (t === 'kchar') {
    cands = [...pools.kchar.entries()].filter(([c, rd]) => c !== correct && !(rd && rd.includes(ans.reading))).map(([c]) => c);
    // vocab-derived kanji with unknown readings are only used if we lack enough known ones
    const known = cands.filter(c => pools.kchar.get(c));
    if (known.length >= 3) cands = known;
  } else {
    cands = pools[t].filter(x => x && x !== correct);
  }
  if (t === 'mean' || t === 'kdef') return shuffle(cands).slice(0, 3);
  const sample = shuffle(cands.slice()).slice(0, 80);
  sample.sort((a, b) => similarity(correct, b) - similarity(correct, a));
  return sample.slice(0, 3);
}

/* ================= home ================= */
function renderHome() {
  $('#quiz').style.display = 'none';
  const h = $('#home'); h.style.display = 'block';
  const ds = doneSet(), pk = pendingKeys();
  let html = '';
  if (!pack) {
    html += `<div class="card"><h2>Start</h2>No reviews downloaded yet.<div class="note">While you have internet: set up the Renshuu button once (below), then use “Get reviews”.</div>
      <a class="btn big" href="${RENSHUU}#rso-get" id="getbtn">Get today's reviews from Renshuu</a></div>`;
  } else {
    let total = 0, left = 0;
    const rows = pack.schedules.map(s => {
      const its = pack.items.filter(i => i.s === s.id);
      let n = 0, d = 0;
      for (const it of its) for (const v of it.v) { n++; if (ds.has(taskKey(it, v)) || pk.has(taskKey(it, v))) d++; }
      total += n; left += n - d;
      if (!n) return '';
      return `<div class="row"><div class="n">${esc(s.name)}<div class="bar"><i style="width:${n ? Math.round(d / n * 100) : 0}%"></i></div></div>
        <div class="c">${n - d} left</div><button class="sm" data-study="${s.id}" ${n - d ? '' : 'disabled'}>Study</button></div>`;
    }).join('');
    const created = new Date(pack.created);
    html += `<div class="card"><h2>Reviews</h2>
      <div class="small dim">Downloaded ${created.toLocaleDateString()} ${created.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · due up to ${esc(pack.limit)}</div>
      ${rows || '<div class="dim" style="padding:8px 0">Nothing due in vocabulary or kanji.</div>'}
      ${left ? `<button class="big" data-study="all">Study all (${left} left)</button>` : (total ? '<div class="note">All done offline 🎉</div>' : '')}
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center" class="small dim">Questions per session
        <select id="size">${[10, 20, 30, 50, 100].map(n => `<option ${n == settings.size ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      ${pack.notes && pack.notes.length ? `<details style="margin-top:10px"><summary class="small">Not available offline (${pack.notes.length})</summary><ul class="small dim">${pack.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></details>` : ''}
    </div>`;
  }
  const right = results.filter(r => r.ok).length;
  html += `<div class="card"><h2>Send to Renshuu</h2>
    ${results.length ? `<b>${results.length}</b> answers waiting (${right} correct, ${results.length - right} missed).` : '<span class="dim">No answers waiting.</span>'}
    ${results.length ? `<button class="big" id="sendbtn">Send answers to Renshuu</button><div class="note">Needs internet. Opens Renshuu; then tap your “rso” bookmark and press “Send to Renshuu”.</div>` : ''}
    ${pack ? `<a class="btn sec big" href="${RENSHUU}#rso-get">Get new reviews from Renshuu</a>` : ''}
  </div>`;
  html += setupHtml();
  h.innerHTML = html;
  h.querySelectorAll('[data-study]').forEach(b => b.onclick = () => startSession(b.dataset.study));
  const sz = $('#size'); if (sz) sz.onchange = () => { settings.size = +sz.value; LS.set('settings', settings); };
  const sb = $('#sendbtn'); if (sb) sb.onclick = sendResults;
  h.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    const ta = document.getElementById(b.dataset.copy); ta.select();
    try { await navigator.clipboard.writeText(ta.value); toast('Copied'); } catch (e) { document.execCommand && document.execCommand('copy'); toast('Copied (or long-press → Copy)'); }
  });
  const cl = $('#clearres'); if (cl) cl.onclick = () => { if (confirm('Delete all answers that were not sent to Renshuu?')) { results = []; keep = {}; LS.set('results', results); LS.set('items', keep); renderHome(); } };
}
function setupHtml() {
  const bm = `javascript:(function(){var s=document.createElement('script');s.src='${APP_BASE}rso.js?'+Date.now();document.body.appendChild(s);})()`;
  const us = `// ==UserScript==
// @name         Renshuu Offline sync
// @match        https://app.renshuu.org/*
// @grant        none
// ==/UserScript==
if (location.hash.indexOf('#rso-') === 0) { var s = document.createElement('script'); s.src = '${APP_BASE}rso.js?' + Date.now(); document.body.appendChild(s); }`;
  return `<div class="card"><details ${pack ? '' : 'open'}><summary><b>Setup (once, while online)</b></summary>
    <ol class="steps small">
      <li>Open this page once with internet so it's saved for offline use. Add it to your home screen or bookmark it.</li>
      <li>Create the Renshuu button: in Chrome add any bookmark, edit it, name it <b>rso</b> and paste this as its URL:
        <textarea class="code" id="bmcode" readonly>${esc(bm)}</textarea><button class="sm sec" data-copy="bmcode">Copy</button></li>
      <li>To use it on a phone: on app.renshuu.org, tap the address bar, type <b>rso</b> and tap the bookmark that appears (the one with the star). On a computer, just click the bookmark.</li>
      <li>Must be logged in to Renshuu in the same browser.</li>
    </ol>
    <details><summary class="small">Alternative: Tampermonkey userscript (runs automatically, no bookmark tap)</summary>
      <textarea class="code" id="uscode" readonly>${esc(us)}</textarea><button class="sm sec" data-copy="uscode">Copy</button></details>
    ${results.length ? '<div style="margin-top:12px"><button class="sm sec" id="clearres">Delete unsent answers</button></div>' : ''}
  </details></div>`;
}

/* ================= session ================= */
let S = null; // current session
function startSession(which) {
  if (!pack) return;
  buildPools();
  const ds = doneSet(), pk = pendingKeys();
  const tasks = [];
  for (const it of pack.items) {
    if (which !== 'all' && String(it.s) !== String(which)) continue;
    for (const v of it.v) { const k = taskKey(it, v); if (!ds.has(k) && !pk.has(k)) tasks.push({ it, v }); }
  }
  if (!tasks.length) { toast('Nothing left here'); return; }
  shuffle(tasks);
  // keep both directions of the same word apart a bit, like Renshuu
  const q = tasks.slice(0, settings.size).map(t => ({ ...t, retry: false }));
  S = { queue: q, total: q.length, answered: 0, right: 0, cur: null, t0: 0 };
  $('#home').style.display = 'none'; $('#quiz').style.display = 'block';
  nextQ();
}
function nextQ() {
  $('#qfb').innerHTML = '';
  if (!S.queue.length) return endSession();
  const t = S.queue.shift();
  const sp = spec(t.it, t.v);
  if (!sp) return nextQ();
  const choices = shuffle([sp.ans.text, ...distractors(sp.ans)]);
  S.cur = { ...t, sp, choices, locked: false };
  S.t0 = Date.now();
  $('#qprog').textContent = `${Math.min(S.answered + 1, S.total)} of ${S.total}` + (t.retry ? ' · retry' : '');
  $('#qbar').style.width = Math.round(S.answered / S.total * 100) + '%';
  const p = $('#qprompt');
  if (sp.prompt.type === 'mean') {
    p.className = 'qprompt mean';
    p.innerHTML = sp.prompt.list.length > 1 ? '<ol>' + sp.prompt.list.map(d => `<li>${esc(d)}</li>`).join('') + '</ol>' : esc(sp.prompt.list[0] || '');
  } else {
    p.className = 'qprompt'; p.style.fontSize = (sp.prompt.text.length > 6 || sp.prompt.small) ? '34px' : '';
    p.textContent = sp.prompt.text;
  }
  $('#qpos').textContent = t.it.t === 'v' ? (t.it.p || '') : '';
  $('#qask').textContent = sp.ask + ':';
  const en = sp.ans.type === 'mean' || sp.ans.type === 'kdef';
  $('#qchoices').innerHTML = choices.map((c, i) => `<button class="choice ${en ? 'en' : ''}" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(c)}</span></button>`).join('');
  $('#qchoices').querySelectorAll('.choice').forEach(b => b.onclick = () => answer(+b.dataset.i));
  $('#qidk').style.display = '';
  window.scrollTo(0, 0);
}
function answer(i) {
  const c = S.cur; if (!c || c.locked) return; c.locked = true;
  const el = Math.round((Date.now() - S.t0) / 1000);
  const ok = i >= 0 && c.choices[i] === c.sp.ans.text;
  $('#qchoices').querySelectorAll('.choice').forEach((b, j) => {
    if (c.choices[j] === c.sp.ans.text) b.classList.add('right');
    else if (j === i) b.classList.add('wrong');
    b.disabled = true;
  });
  $('#qidk').style.display = 'none';
  if (!c.retry) {
    // first attempt is what Renshuu would have recorded
    const it = c.it;
    results.push({ r: rid(), s: it.s, t: it.t, i: it.id, v: c.v, ok: ok ? 1 : 0, e: el, at: Date.now(), pk: pack.id });
    LS.set('results', results);
    if (done.pack !== pack.id) done = { pack: pack.id, keys: [] };
    done.keys.push(taskKey(it, c.v)); LS.set('done', done);
    S.answered++; if (ok) S.right++;
    if (!ok) S.queue.push({ it: c.it, v: c.v, retry: true });
  } else if (!ok) {
    S.queue.push({ it: c.it, v: c.v, retry: true });
  }
  showFeedback(ok);
}
function showFeedback(ok) {
  const it = S.cur.it;
  let det;
  if (it.t === 'v') {
    det = `<div class="term">${esc(it.K)}</div>${it.K !== it.H ? `<div class="read">${esc(it.H)}</div>` : ''}${it.pi ? `<div class="small dim">Accent: ${esc(it.pi)}</div>` : ''}
      <div class="small dim">${esc(it.p || '')}</div><ol>${(it.D || []).map(d => `<li>${esc(d)}</li>`).join('')}</ol>`;
  } else {
    det = `<div class="term">${esc(it.C)}</div><div class="small">On: ${esc((it.on || []).join('、') || '—')}<br>Kun: ${esc((it.kun || []).join('、') || '—')}</div><div style="margin-top:6px">${esc(it.D)}</div>`;
  }
  $('#qfb').innerHTML = `<div class="fb"><div class="res ${ok ? 'ok' : 'bad'}">${ok ? '✓ Correct' : '✗ ' + (S.cur.retry ? 'Still missed' : 'Missed')}</div>${det}
    <button class="next" id="qnext">Next ›</button></div>`;
  $('#qnext').onclick = nextQ;
  $('#qnext').focus({ preventScroll: true });
  setTimeout(() => $('#qfb').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 30);
}
function endSession() {
  const s = S; S = null;
  toast(`Session done: ${s.right}/${s.total} correct`);
  renderHome();
}
$('#qidk').onclick = () => answer(-1);
$('#qquit').onclick = () => { if (S) { S = null; renderHome(); } };
document.addEventListener('keydown', e => {
  if (!S || !S.cur) return;
  if (!S.cur.locked && /^[1-6]$/.test(e.key)) answer(+e.key - 1);
  else if (S.cur.locked && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQ(); }
});

/* ================= sync handoff ================= */
async function sendResults() {
  if (!navigator.onLine && !confirm('You seem to be offline. Try anyway?')) return;
  const need = new Set(results.map(r => r.s));
  const items = allItems().filter(it => need.has(it.s));
  const schedules = [...(pack ? pack.schedules : [])];
  for (const r of results) if (!schedules.some(s => s.id === r.s)) schedules.push({ id: r.s, name: String(r.s) });
  const data = await b64Encode({ v: 1, schedules, items, results: results.map(({ r, s, t, i, v, ok, e }) => ({ r, s, t, i, v, ok, e })) });
  location.href = RENSHUU + '#rso-sync:' + data;
}

/* ================= incoming data (from rso.js) ================= */
async function handleHash() {
  const h = location.hash;
  if (!h || h.length < 3) return;
  try {
    if (h.startsWith('#pack:')) {
      const p = await b64Decode(h.slice(6));
      // keep items still needed by unsent answers
      const need = new Set(results.map(r => r.s + '|' + r.t + '|' + r.i));
      const nk = {};
      for (const it of allItems()) if (need.has(itemKey(it))) nk[itemKey(it)] = it;
      keep = nk; LS.set('items', keep);
      pack = p; LS.set('pack', pack);
      const n = p.items.reduce((a, it) => a + it.v.length, 0);
      toast(`Downloaded ${n} questions — ready for offline`);
    } else if (h.startsWith('#synced:')) {
      const ids = new Set(await b64Decode(h.slice(8)));
      const before = results.length;
      results = results.filter(r => !ids.has(r.r));
      LS.set('results', results);
      const need = new Set(results.map(r => r.s + '|' + r.t + '|' + r.i));
      for (const k of Object.keys(keep)) if (!need.has(k)) delete keep[k];
      LS.set('items', keep);
      toast(`${before - results.length} answers are now on Renshuu`);
    }
  } catch (e) {
    toast('Could not read data: ' + e.message, 5000);
  }
  history.replaceState(null, '', location.pathname + location.search);
}

/* ================= boot ================= */
function netPill() { const p = $('#net'); const on = navigator.onLine; p.textContent = on ? 'online' : 'offline'; p.className = 'pill ' + (on ? 'on' : 'off'); }
addEventListener('online', netPill); addEventListener('offline', netPill);
addEventListener('hashchange', () => handleHash().then(renderHome));
netPill();
handleHash().then(renderHome);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
